# [tools] - 开发工具版本
[tools]
node = "24"
pnpm = "10"

# [env] - 环境变量
[env]

# [tasks] - 项目任务

[tasks.clean]
description = "清理"
run = "pnpm exec rimraf dist"

[tasks.install]
description = "安装依赖"
run = """
    pnpm install
    && pnpm config set shamefully-hoist true
    && pnpm config set public-hoist-pattern *
"""

[tasks.build]
description = "构建"
depends = ["install"]
run = "pnpm run docs:build"

[tasks.dev]
description = "开发"
depends = ["install"]
run = "pnpm run docs:dev"

[tasks.preview]
description = "预览"
depends = ["build"]
run = "pnpm run docs:preview"

