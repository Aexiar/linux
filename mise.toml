# [tools] - 开发工具版本
[tools]
node = "24"
pnpm = "10"
watchexec = "2.5.1"

# [tasks] - 项目任务

[tasks.clean]
description = "清理"
run = "pnpm exec rimraf docs/.vitepress/dist"

[tasks.install]
description = "安装依赖"
run = "pnpm install"

[tasks.build]
description = "构建"
run = "pnpm run docs:build"

[tasks."dev:server"]
description = "启动 VitePress 开发服务器"
run = "pnpm run docs:dev"

[tasks."format:md"]
description = "修正 Markdown 中文排版"
run = [
    "pnpm exec autocorrect --fix docs",
    "pnpm exec textlint --no-textlintrc --rulesdir .textlint-rules --fix \"docs/**/*.md\"",
]
sources = ["docs/**/*.md"]

[tasks."format:watch"]
description = "监听并修正 Markdown"
run = "mise watch format:md"

[tasks.dev]
description = "启动开发服务器并监听 Markdown"
run = [
    { tasks = ["dev:server", "format:watch"] },
]

[tasks.preview]
description = "预览"
depends = ["build"]
run = "pnpm run docs:preview"
